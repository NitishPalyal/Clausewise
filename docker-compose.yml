services:
  postgres:
    image: postgres:17-alpine
    container_name: clausewise-postgres
    environment:
      POSTGRES_DB: clausewise
      POSTGRES_USER: clausewise
      POSTGRES_PASSWORD: clausewise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clausewise -d clausewise"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: clausewise-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10